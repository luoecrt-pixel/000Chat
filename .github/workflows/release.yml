name: Build Android Release

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tools/verify_v4_17_0.py" ]; then
            python3 tools/verify_v4_17_0.py
          else
            echo "::error::Missing release verifier tools/verify_v4_17_0.py"
            exit 1
          fi

      - name: Release lint, tests and bundles
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test lintRelease assembleRelease bundleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
