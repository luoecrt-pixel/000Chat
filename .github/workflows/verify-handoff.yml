name: Verify handoff

on:
  pull_request:
    paths:
      # GitHubMergeCheckPolicy requires this check on every Markdown-only PR.
      # Previously docs/foo.md was not eligible to run it, blocking safe merge.
      - '*.md'
      - '**/*.md'
      - tools/**

permissions:
  contents: read

jobs:
  verify-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run handoff verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_handoff.py
