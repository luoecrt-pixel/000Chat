name: Extract Android source

on:
  push:
    branches: [ refactor/extract-source ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract source archive into repository root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(find . -maxdepth 3 -type f -name '*-source.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one *-source.zip, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          extract_dir="$RUNNER_TEMP/source"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          mapfile -t settings_roots < <(find "$extract_dir" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | sort -u)
          if [ "${#settings_roots[@]}" -ne 1 ]; then
            echo "Expected exactly one Gradle project root, found ${#settings_roots[@]}" >&2
            printf '%s\n' "${settings_roots[@]}" >&2
            exit 1
          fi

          source_root="${settings_roots[0]}"
          find "$source_root" -type d -name .git -prune -exec rm -rf {} +

          while IFS= read -r -d '' item; do
            cp -a "$item" .
          done < <(find "$source_root" -mindepth 1 -maxdepth 1 ! -name '.github' -print0)

          rm -f "$archive"

      - name: Write direct repository CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'YAML'
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify source before build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tools/verify_v4_16_2.py" ]; then
            python3 tools/verify_v4_16_2.py
          elif [ -f "tools/verify_v4_16_1.py" ]; then
            echo "::warning::Using legacy verifier tools/verify_v4_16_1.py"
            python3 tools/verify_v4_16_1.py
          else
            echo "No Astra static verifier found; continuing to Gradle checks."
          fi

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
YAML

      - name: Remove migration workflow
        run: rm -f .github/workflows/source-migration.yml

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes detected"
            exit 0
          fi
          git commit -m "refactor: extract Android source from archive"
          git push origin HEAD:refactor/extract-source