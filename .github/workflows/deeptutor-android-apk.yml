name: DeepTutor - Android APK

on:
  push:
    branches: [deeptutor-android-client]
    paths: ['.github/workflows/deeptutor-android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 15 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android app
        shell: bash
        run: |
          mkdir -p client/app/src/main/java/org/deeptutor/android
          cat > client/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'DeepTutorClient'
          include ':app'
          EOF
          cat > client/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > client/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > client/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'org.deeptutor.android'
            compileSdk 35
            defaultConfig {
              applicationId 'org.deeptutor.android'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > client/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="false"
              android:usesCleartextTraffic="true"
              android:label="DeepTutor"
              android:icon="@android:drawable/ic_menu_info_details"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > client/app/src/main/java/org/deeptutor/android/MainActivity.java <<'EOF'
          package org.deeptutor.android;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.net.URI;

          public class MainActivity extends Activity {
            private static final int UPLOAD = 101;
            private WebView web;
            private android.webkit.ValueCallback<Uri[]> upload;
            private String server = "";
            private int dp(int n) {
              return (int)(n * getResources().getDisplayMetrics().density);
            }
            private TextView txt(String s, int size) {
              TextView t = new TextView(this);
              t.setText(s);
              t.setTextSize(size);
              t.setTextColor(Color.rgb(25,35,60));
              return t;
            }
            private Button btn(String s) {
              Button b = new Button(this);
              b.setText(s);
              b.setTextAllCaps(false);
              return b;
            }
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              server=getPreferences(MODE_PRIVATE).getString("server", "");
              if(server.isEmpty()) setup(); else open(server);
            }
            private void cleanup() {
              if(web!=null) { web.stopLoading(); web.destroy(); web=null; }
            }
            private void setup() {
              cleanup();
              LinearLayout l = new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              l.setPadding(dp(22),dp(30),dp(22),dp(22));
              l.setBackgroundColor(Color.WHITE);
              setContentView(l);
              TextView h=txt("DeepTutor",30);
              l.addView(h);
              TextView info=txt("Android-клиент для собственного DeepTutor. "+
                "Нужен запущенный сервер, APK не содержит ИИ и серверной части.",16);
              info.setPadding(0,dp(18),0,dp(18));
              l.addView(info);
              EditText input = new EditText(this);
              input.setSingleLine(true);
              input.setText(server);
              input.setHint("https://ваш-сервер.example.org");
              l.addView(input);
              Button connect=btn("Открыть DeepTutor");
              l.addView(connect);
              TextView note=txt("Пример в домашней сети: http://192.168.1.10:3782\n"+
                "Для доступа из интернета рекомендуется HTTPS.",14);
              note.setPadding(0,dp(14),0,0);
              l.addView(note);
              connect.setOnClickListener(v -> {
                String u=input.getText().toString().trim();
                if(!u.contains("://")) u="https://"+u;
                try {
                  URI parsed=new URI(u);
                  if(parsed.getHost()==null ||
                      !(parsed.getScheme().equalsIgnoreCase("http") ||
                        parsed.getScheme().equalsIgnoreCase("https")) ||
                      parsed.getUserInfo()!=null) throw new Exception();
                  server=u;
                  getPreferences(MODE_PRIVATE).edit().putString("server",server).apply();
                  open(server);
                } catch(Exception e) {
                  input.setError("Укажите корректный адрес HTTP или HTTPS");
                }
              });
            }
            private void open(String url) {
              cleanup();
              LinearLayout root=new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              setContentView(root);
              LinearLayout bar=new LinearLayout(this);
              root.addView(bar,new LinearLayout.LayoutParams(-1,dp(50)));
              Button back=btn("‹");
              bar.addView(back,new LinearLayout.LayoutParams(dp(50),-1));
              back.setOnClickListener(v->{
                if(web!=null && web.canGoBack()) web.goBack(); else setup();
              });
              TextView name=txt("DeepTutor",16);
              name.setGravity(android.view.Gravity.CENTER_VERTICAL);
              bar.addView(name,new LinearLayout.LayoutParams(0,-1,1));
              Button refresh=btn("↻");
              bar.addView(refresh,new LinearLayout.LayoutParams(dp(50),-1));
              refresh.setOnClickListener(v->{if(web!=null)web.reload();});
              Button change=btn("URL");
              bar.addView(change,new LinearLayout.LayoutParams(dp(68),-1));
              change.setOnClickListener(v->setup());
              web=new WebView(this);
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(true);
              s.setBuiltInZoomControls(true);
              s.setDisplayZoomControls(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              s.setSafeBrowsingEnabled(true);
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView w, WebResourceRequest r) {
                  Uri u=r.getUrl();
                  String scheme=u.getScheme();
                  if("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme))
                    return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW,u)); }
                  catch(Exception e) { Toast.makeText(MainActivity.this,"Нет приложения для ссылки",0).show(); }
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView w,
                    android.webkit.ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if(upload!=null)upload.onReceiveValue(null);
                  upload=cb;
                  try { startActivityForResult(params.createIntent(),UPLOAD); return true; }
                  catch(Exception ex) { upload=null; return false; }
                }
              });
              web.setDownloadListener((u,agent,disposition,mime,len)->{
                try {
                  DownloadManager.Request req=new DownloadManager.Request(Uri.parse(u));
                  String cookie=CookieManager.getInstance().getCookie(u);
                  if(cookie!=null)req.addRequestHeader("Cookie",cookie);
                  if(agent!=null)req.addRequestHeader("User-Agent",agent);
                  String filename=URLUtil.guessFileName(u,disposition,mime);
                  req.setTitle(filename);
                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,filename);
                  ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                  Toast.makeText(this,"Скачивание началось",0).show();
                } catch(Exception ex) {
                  Toast.makeText(this,"Не удалось скачать файл",0).show();
                }
              });
              root.addView(web,new LinearLayout.LayoutParams(-1,0,1));
              web.loadUrl(url);
            }
            @Override protected void onActivityResult(int request, int result, Intent data) {
              super.onActivityResult(request,result,data);
              if(request==UPLOAD && upload!=null) {
                upload.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));
                upload=null;
              }
            }
            @Override public void onBackPressed() {
              if(web!=null && web.canGoBack())web.goBack();
              else if(web!=null)setup();
              else super.onBackPressed();
            }
            @Override protected void onDestroy() {
              if(upload!=null)upload.onReceiveValue(null);
              cleanup();
              super.onDestroy();
            }
          }
          EOF
      - name: Build APK
        shell: bash
        working-directory: client
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-Poco-X7-Pro-APK
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
