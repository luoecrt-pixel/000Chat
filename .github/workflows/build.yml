name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tools/verify_v4_16_2.py" ]; then
            python3 tools/verify_v4_16_2.py
          elif [ -f "tools/verify_v4_16_1.py" ]; then
            echo "::warning::Using legacy verifier tools/verify_v4_16_1.py"
            python3 tools/verify_v4_16_1.py
          else
            echo "No Astra static verifier found; continuing to Gradle checks."
          fi

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error