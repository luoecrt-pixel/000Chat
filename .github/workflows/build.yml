name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: vars.CI_AUTO_RUN == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_handoff.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tools/verify_v4_17_0.py" ]; then
            python3 tools/verify_v4_17_0.py
          elif [ -f "tools/verify_v4_16_2.py" ]; then
            echo "::warning::Using legacy verifier tools/verify_v4_16_2.py"
            python3 tools/verify_v4_16_2.py
          else
            echo "No Astra static verifier found; continuing to Gradle checks."
          fi

      - name: Verify verifier mutation matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_verify_v4_17_0_mutations.py

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Free runner disk for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before Android emulator cleanup"
          df -h
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$sdk_root/system-images"/*
          sudo rm -rf "$sdk_root/ndk"/*
          sudo apt-get clean
          echo "Disk usage after Android emulator cleanup"
          df -h

      - name: Android lifecycle instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error