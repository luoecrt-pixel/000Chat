name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate project or source archive
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project_root() {
            local base="$1"
            if [ -f "$base/settings.gradle.kts" ] || [ -f "$base/settings.gradle" ]; then
              printf '%s\n' "$base"
              return 0
            fi
            mapfile -t roots < <(find "$base" -mindepth 1 -maxdepth 6 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | sort -u)
            if [ "${#roots[@]}" -eq 1 ]; then
              printf '%s\n' "${roots[0]}"
              return 0
            fi
            return 1
          }

          project_dir=""
          project_dir="$(find_project_root . || true)"

          if [ -z "$project_dir" ]; then
            mapfile -t zips < <(find . -mindepth 1 -maxdepth 5 -type f -name '*-source.zip' -printf '%p\n' | sort)
            if [ "${#zips[@]}" -eq 1 ]; then
              archive="${zips[0]}"
              extract_dir="$RUNNER_TEMP/astra-source"
              rm -rf "$extract_dir"
              mkdir -p "$extract_dir"
              echo "No Gradle project found directly; extracting source archive: $archive"
              unzip -o -q "$archive" -d "$extract_dir"
              project_dir="$(find_project_root "$extract_dir" || true)"
            elif [ "${#zips[@]}" -gt 1 ]; then
              echo "Multiple source archives found:" >&2
              printf ' - %s\n' "${zips[@]}" >&2
              exit 1
            fi
          fi

          if [ -z "$project_dir" ]; then
            echo "Could not locate a Gradle project." >&2
            echo "Expected either settings.gradle(.kts) in the repository or exactly one *-source.zip anywhere up to depth 5." >&2
            echo "Repository top-level contents:" >&2
            find . -maxdepth 2 -mindepth 1 -print | sort | sed -n '1,200p' >&2
            exit 1
          fi

          project_dir="$(cd "$project_dir" && pwd)"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Gradle project root: $project_dir"
          echo "Project contents:"
          find "$project_dir" -maxdepth 2 -mindepth 1 -print | sort | sed -n '1,160p'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify source before build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f "tools/verify_v4_16_2.py" ]; then
            python3 tools/verify_v4_16_2.py
          elif [ -f "tools/verify_v4_16_1.py" ]; then
            echo "::warning::Using legacy verifier tools/verify_v4_16_1.py"
            python3 tools/verify_v4_16_1.py
          else
            echo "::warning::No Astra static verifier found; continuing to Gradle build."
          fi

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using persistent debug keystore from secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; a new signing key will be generated."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app-debug.apk
          if-no-files-found: error
