name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name '*-source.zip' -printf '%p\n' | sort)
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "Multiple source archives found:"
            printf ' - %s\n' "${zips[@]}"
            exit 1
          fi
          if [ "${#zips[@]}" -eq 1 ]; then
            echo "archive=${zips[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "archive=" >> "$GITHUB_OUTPUT"
          fi

      - name: Unzip project source
        if: steps.source.outputs.archive != ''
        run: unzip -o -q "${{ steps.source.outputs.archive }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify source before build
        run: python3 tools/verify_v4_16_1.py

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using persistent debug keystore from secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; a new signing key will be generated."
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
