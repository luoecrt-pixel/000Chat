name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name '*-source.zip' -printf '%p\n' | sort)
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "Multiple source archives found:"
            printf ' - %s\n' "${zips[@]}"
            exit 1
          fi
          if [ "${#zips[@]}" -eq 1 ]; then
            echo "archive=${zips[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "archive=" >> "$GITHUB_OUTPUT"
          fi

      - name: Unzip project source
        if: steps.source.outputs.archive != ''
        shell: bash
        run: |
          set -euo pipefail
          unzip -o -q "${{ steps.source.outputs.archive }}"

      - name: Locate Gradle project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            project_dir="."
          else
            mapfile -t roots < <(find . -mindepth 1 -maxdepth 2 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | sort -u)
            if [ "${#roots[@]}" -ne 1 ]; then
              echo "Could not determine a unique Gradle project root. Found:" >&2
              printf ' - %s\n' "${roots[@]:-<none>}" >&2
              exit 1
            fi
            project_dir="${roots[0]}"
          fi
          project_dir="${project_dir#./}"
          if [ -z "$project_dir" ]; then project_dir="."; fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Gradle project root: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify source before build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/verify_v4_16_1.py

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using persistent debug keystore from secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; a new signing key will be generated."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app-debug.apk
          if-no-files-found: error
