name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: unzip -o *.zip
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Align Java and Kotlin Targets
        run: |
          find . -name "build.gradle*" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +
        
      - name: Build with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=ignore
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: API-Chat-App
          path: app/build/outputs/apk/debug/*.apk
