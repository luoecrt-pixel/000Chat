name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize source layout
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          migrated=false

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            mapfile -t zips < <(find . -mindepth 1 -maxdepth 5 -type f -name '*-source.zip' -print | sort)
            if [ "${#zips[@]}" -ne 1 ]; then
              echo "Expected exactly one source archive while the repository has no Gradle project root." >&2
              printf '%s\n' "${zips[@]}" >&2
              exit 1
            fi

            archive="${zips[0]}"
            extract_dir="$RUNNER_TEMP/astra-source"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            unzip -q "$archive" -d "$extract_dir"

            mapfile -t roots < <(find "$extract_dir" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | sort -u)
            if [ "${#roots[@]}" -ne 1 ]; then
              echo "Expected exactly one Gradle project root inside the archive; found ${#roots[@]}." >&2
              printf '%s\n' "${roots[@]}" >&2
              exit 1
            fi

            source_root="${roots[0]}"
            find "$source_root" -type d -name .git -prune -exec rm -rf {} +
            while IFS= read -r -d '' item; do
              cp -a "$item" .
            done < <(find "$source_root" -mindepth 1 -maxdepth 1 ! -name '.github' -print0)

            rm -f "$archive"
            migrated=true
          fi

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "Gradle project root is still missing after normalization." >&2
            exit 1
          fi

          echo "migrated=$migrated" >> "$GITHUB_OUTPUT"
          echo "Project root: $(pwd)"
          echo "Top-level files:"
          find . -maxdepth 1 -mindepth 1 -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify source before build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tools/verify_v4_16_2.py" ]; then
            python3 tools/verify_v4_16_2.py
          elif [ -f "tools/verify_v4_16_1.py" ]; then
            echo "::warning::Using legacy verifier tools/verify_v4_16_1.py"
            python3 tools/verify_v4_16_1.py
          else
            echo "No Astra static verifier found; continuing to Gradle checks."
          fi

      - name: Decode persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test lintDebug assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenAIApiChat-Astra-debug
          path: app-debug.apk
          if-no-files-found: error

      - name: Persist normalized source layout
        if: steps.normalize.outputs.migrated == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract Android source from archive"
          git push origin HEAD:main